<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-label="Policy Brief No. 1 — Education cover artwork">
  <defs>
    <!-- Deep plum-to-navy gradient background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A0642"/>
      <stop offset="55%" stop-color="#7D0A6D"/>
      <stop offset="100%" stop-color="#2B0829"/>
    </linearGradient>
    <!-- Amber accent glow -->
    <radialGradient id="glow" cx="72%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#FE9F00" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FE9F00" stop-opacity="0"/>
    </radialGradient>
    <!-- Amber line gradient -->
    <linearGradient id="amber-fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FE9F00"/>
      <stop offset="100%" stop-color="#FFB733"/>
    </linearGradient>
    <!-- Clip for rounded card -->
    <clipPath id="card-clip">
      <rect width="480" height="320" rx="0"/>
    </clipPath>
    <!-- Filter for soft shadow on text -->
    <filter id="txt-shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g clip-path="url(#card-clip)">
    <!-- Background -->
    <rect width="480" height="320" fill="url(#bg)"/>
    <rect width="480" height="320" fill="url(#glow)"/>

    <!-- ===== GEOMETRIC PATTERN — African-inspired angular motif ===== -->
    <!-- Top-right corner: large semi-circle arc -->
    <circle cx="420" cy="0" r="140" fill="none" stroke="#FE9F00" stroke-width="1.2" stroke-opacity="0.22"/>
    <circle cx="420" cy="0" r="110" fill="none" stroke="#FE9F00" stroke-width="0.8" stroke-opacity="0.15"/>

    <!-- Bottom-left organic geometry -->
    <ellipse cx="30" cy="300" rx="90" ry="70" fill="#FE9F00" fill-opacity="0.07"/>
    <ellipse cx="30" cy="300" rx="55" ry="42" fill="#FE9F00" fill-opacity="0.07"/>

    <!-- Subtle diagonal line texture (right half) -->
    <g stroke="#fff" stroke-width="0.5" stroke-opacity="0.04">
      <line x1="260" y1="0" x2="480" y2="220"/>
      <line x1="290" y1="0" x2="480" y2="190"/>
      <line x1="320" y1="0" x2="480" y2="160"/>
      <line x1="350" y1="0" x2="480" y2="130"/>
      <line x1="380" y1="0" x2="480" y2="100"/>
      <line x1="240" y1="0" x2="480" y2="240"/>
    </g>

    <!-- ===== LEFT COLUMN — numbering + icon ===== -->
    <!-- Amber left accent bar -->
    <rect x="0" y="0" width="5" height="320" fill="url(#amber-fade)"/>

    <!-- POLICY BRIEF label -->
    <rect x="22" y="22" width="130" height="22" rx="4" fill="#FE9F00" fill-opacity="0.15"/>
    <text x="30" y="37" font-family="'Sora', 'Inter', Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="2.5" fill="#FE9F00" text-rendering="geometricPrecision">POLICY BRIEF</text>

    <!-- Large issue number "01" -->
    <text x="24" y="155" font-family="'Sora', 'Inter', Arial, sans-serif" font-size="108" font-weight="800" fill="#fff" fill-opacity="0.06" letter-spacing="-4" text-rendering="geometricPrecision">01</text>
    <text x="26" y="148" font-family="'Sora', 'Inter', Arial, sans-serif" font-size="80" font-weight="800" fill="#FE9F00" fill-opacity="0.9" letter-spacing="-2" filter="url(#txt-shadow)" text-rendering="geometricPrecision">01</text>

    <!-- Thin horizontal rule under number -->
    <rect x="24" y="158" width="48" height="3" rx="2" fill="#FE9F00"/>

    <!-- SERIES label below rule -->
    <text x="24" y="178" font-family="'Inter', Arial, sans-serif" font-size="9.5" font-weight="500" letter-spacing="1.5" fill="#fff" fill-opacity="0.5" text-rendering="geometricPrecision">SERIES 2026</text>

    <!-- Education Icon: open book SVG path at bottom-left -->
    <g transform="translate(22, 230) scale(2.4)" stroke="#FE9F00" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.7">
      <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
      <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
    </g>

    <!-- ===== RIGHT COLUMN — main content ===== -->
    <!-- Divider line -->
    <rect x="148" y="0" width="1" height="320" fill="#fff" fill-opacity="0.08"/>

    <!-- Organization badge -->
    <rect x="164" y="26" width="180" height="18" rx="9" fill="#fff" fill-opacity="0.06"/>
    <text x="174" y="38.5" font-family="'Inter', Arial, sans-serif" font-size="9" font-weight="600" letter-spacing="1.2" fill="#fff" fill-opacity="0.65" text-rendering="geometricPrecision">MIGRATION PULSE HUB</text>

    <!-- Main title — multi-line -->
    <text font-family="'Sora', 'Inter', Arial, sans-serif" font-weight="700" fill="#fff" filter="url(#txt-shadow)" text-rendering="geometricPrecision">
      <tspan x="164" y="80" font-size="17.5">Accelerating the</tspan>
      <tspan x="164" dy="23" font-size="17.5">Integration of Refugee</tspan>
      <tspan x="164" dy="23" font-size="17.5">&amp; Migrant Children</tspan>
      <tspan x="164" dy="23" font-size="17.5">into National Education</tspan>
    </text>

    <!-- Subtitle / region tag -->
    <rect x="164" y="178" width="140" height="20" rx="4" fill="#FE9F00" fill-opacity="0.15"/>
    <text x="172" y="191.5" font-family="'Inter', Arial, sans-serif" font-size="9.5" font-weight="600" letter-spacing="1" fill="#FE9F00" text-rendering="geometricPrecision">HORN OF AFRICA · 2026</text>

    <!-- Excerpt / pull quote -->
    <text font-family="'Inter', Arial, sans-serif" font-size="11" fill="#fff" fill-opacity="0.72" text-rendering="geometricPrecision">
      <tspan x="164" y="218">"A child's right to learn is not defined</tspan>
      <tspan x="164" dy="16">by the borders they crossed."</tspan>
    </text>

    <!-- Author line -->
    <text x="164" y="260" font-family="'Inter', Arial, sans-serif" font-size="10" font-weight="500" fill="#fff" fill-opacity="0.55" text-rendering="geometricPrecision">By Damaris Oluga</text>
    <text x="164" y="274" font-family="'Inter', Arial, sans-serif" font-size="9.5" fill="#FE9F00" fill-opacity="0.8" text-rendering="geometricPrecision">Regional Coordination Manager</text>

    <!-- Amber bottom stripe -->
    <rect x="148" y="302" width="332" height="18" rx="0" fill="#FE9F00" fill-opacity="0.12"/>

    <!-- Education theme dots — subtle motif row -->
    <circle cx="180" cy="298" r="3.5" fill="#FE9F00" fill-opacity="0.35"/>
    <circle cx="196" cy="298" r="3.5" fill="#FE9F00" fill-opacity="0.25"/>
    <circle cx="212" cy="298" r="3.5" fill="#FE9F00" fill-opacity="0.18"/>
    <circle cx="228" cy="298" r="2.5" fill="#FE9F00" fill-opacity="0.12"/>

    <!-- Creative Commons CC badge -->
    <text x="408" y="313" font-family="'Inter', Arial, sans-serif" font-size="8.5" fill="#fff" fill-opacity="0.3" text-anchor="end" text-rendering="geometricPrecision">CC BY 4.0  ·  migrationpulsehub.org</text>
  </g>
</svg>
