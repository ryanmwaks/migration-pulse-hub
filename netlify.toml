# ============================================================
# Netlify configuration — Migration Pulse Hub
# migrationpulsehub.org
# ============================================================

[build]
  publish   = "."                    # serve files from the root folder
  functions = "netlify/functions"    # Netlify Functions directory

# ── Redirect www → apex ─────────────────────────────────────
[[redirects]]
  from   = "https://www.migrationpulsehub.org/*"
  to     = "https://migrationpulsehub.org/:splat"
  status = 301
  force  = true

# ── Clean 404 handling ───────────────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 404

# ── Security & cache headers ─────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options              = "DENY"
    X-Content-Type-Options       = "nosniff"
    Referrer-Policy              = "strict-origin-when-cross-origin"
    Permissions-Policy           = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security    = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy      = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.web3forms.com https://api.emailjs.com https://www.google-analytics.com https://www.googletagmanager.com; frame-src https://www.google.com; object-src 'none'"

# Cache HTML pages — short TTL so updates publish quickly
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Cache assets aggressively — versioned with ?v= query strings
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images aggressively
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Service Worker — always revalidated so clients pick up new versions immediately
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
