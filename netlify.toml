# ============================================================
# Netlify configuration — Migration Pulse Hub
# migrationpulsehub.org
# ============================================================

[build]
  publish = "."        # serve files from the root folder

# ── Redirect www → apex ─────────────────────────────────────
[[redirects]]
  from   = "https://www.migrationpulsehub.org/*"
  to     = "https://migrationpulsehub.org/:splat"
  status = 301
  force  = true

# ── Clean 404 handling ───────────────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 404

# ── Security & cache headers ─────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options       = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy       = "strict-origin-when-cross-origin"
    Permissions-Policy    = "camera=(), microphone=(), geolocation=()"

# Cache HTML pages — short TTL so updates publish quickly
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Cache assets aggressively — versioned with ?v= query strings
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images aggressively
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
